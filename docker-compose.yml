services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: jobhunter_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunter -d jobhunter_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./job_hunter
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "8002:8002"
    restart: unless-stopped
    env_file:
      - ./job_hunter/.env
    environment:
      - PLAYWRIGHT_HEADLESS=true
      - DATABASE_URL=postgresql://jobhunter:devpass@postgres:5432/jobhunter_db
      - AUTH_SECRET=jobhunter-dev-secret-CHANGE-IN-PRODUCTION
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=codeaerospace@gmail.com
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_FROM=codeaerospace@gmail.com
      - EMAIL_FROM_NAME=CO.DE Aerospace
      - WHATSAPP_BOT_NUMBER=${WHATSAPP_BOT_NUMBER:-}
    shm_size: '256m'
    volumes:
      - ./job_hunter/db:/app/db
      - ./job_hunter/outputs:/app/outputs
      - ./job_hunter/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://api:8000
      - AUTH_SECRET=jobhunter-nextauth-secret-CHANGE-IN-PRODUCTION
      - AUTH_URL=http://localhost:3000
      - AUTH_TRUST_HOST=true
      - NEXT_TELEMETRY_DISABLED=1

volumes:
  postgres_data:

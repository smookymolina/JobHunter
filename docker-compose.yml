services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: jobhunter_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunter -d jobhunter_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./job_hunter
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "8002:8002"
    restart: unless-stopped
    env_file:
      - ./job_hunter/.env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PLAYWRIGHT_HEADLESS=true
      - DATABASE_URL=postgresql://jobhunter:devpass@postgres:5432/jobhunter_db
      - AUTH_SECRET=${AUTH_SECRET:-jobhunter-dev-secret-CHANGE-IN-PRODUCTION}
      - OTP_SECRET=${OTP_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Job Hunter}
      - WHATSAPP_CLOUD_API_TOKEN=${WHATSAPP_CLOUD_API_TOKEN:-}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_WHATSAPP_FROM=${TWILIO_WHATSAPP_FROM:-}
      - WHATSAPP_BOT_NUMBER=${WHATSAPP_BOT_NUMBER:-}
      - WHATSAPP_API_URL=http://whatsapp-bot:3001/send
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ADMIN_ID=${TELEGRAM_ADMIN_ID:-}
      - MCP_USER_ID=${MCP_USER_ID:-default_user}
      - MCP_API_EMAIL=${MCP_API_EMAIL:-speedysmoking@gmail.com}
      - MCP_API_PASSWORD=${MCP_API_PASSWORD:?define MCP_API_PASSWORD en el .env de la raiz}
    shm_size: '256m'
    volumes:
      - ./job_hunter/db:/app/db
      - ./job_hunter/outputs:/app/outputs
      - ./job_hunter/logs:/app/logs
      - ./job_hunter/data:/app/data
      - ./job_hunter/context:/app/context
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - NEXT_PUBLIC_API_URL=/backend
      - BACKEND_URL=http://api:8000
      - AUTH_SECRET=jobhunter-nextauth-secret-CHANGE-IN-PRODUCTION
      - NEXTAUTH_SECRET=jobhunter-nextauth-secret-CHANGE-IN-PRODUCTION
      - AUTH_URL=http://localhost:3000
      - NEXTAUTH_URL=http://localhost:3000
      - AUTH_TRUST_HOST=true
      - NEXT_TELEMETRY_DISABLED=1
      - NODE_OPTIONS=--dns-result-order=ipv4first

  mcp-marulanda:
    build:
      context: ./job_hunter
      dockerfile: Dockerfile
    command: ["sh", "-c", "cd /app/src && python mcp_server_http.py"]
    ports:
      - "8003:8002"
    restart: unless-stopped
    environment:
      - API_BASE_URL=http://api:8000
      - MCP_USER_ID=538dfb32aa5443eb90e2abb133bd51af
      - MCP_API_EMAIL=maria.marulanda@test.com
      - MCP_API_PASSWORD=${MCP_MARULANDA_PASSWORD:?define MCP_MARULANDA_PASSWORD en el .env de la raiz}
    volumes:
      - ./job_hunter/outputs:/app/outputs
      - ./job_hunter/data:/app/data
      - ./job_hunter/context:/app/context
      - ./job_hunter/logs:/app/logs
    depends_on:
      api:
        condition: service_healthy

  whatsapp-bot:
    build:
      context: ./whatsapp-bot
    ports:
      - "3001:3001"
    restart: unless-stopped
    volumes:
      - ./whatsapp-session:/app/.wwebjs_auth
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G

volumes:
  postgres_data:

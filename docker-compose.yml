services:
  api:
    build:
      context: ./job_hunter
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "8002:8002"
    restart: unless-stopped
    env_file:
      - ./job_hunter/.env
    environment:
      - PLAYWRIGHT_HEADLESS=true
    shm_size: '256m'
    volumes:
      - ./job_hunter/db:/app/db
      - ./job_hunter/outputs:/app/outputs
      - ./job_hunter/logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      - NODE_ENV=production
